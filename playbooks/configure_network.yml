---
- name: Configure clients and servers
  hosts: client,server

  tasks:

    - name: Generate network config
      template:
        src: host_interfaces.j2
        dest: /etc/network/interfaces
        backup: yes

    - name: Check existing routes
      command: ip route
      register: current_routes
      changed_when: false

    - name: Add static routes
      command: ip route add {{ item.network }} via {{ item.via }}
      loop: "{{ static_routes }}"
      when: item.network not in current_routes.stdout

- name: Configure router
  hosts: router

  tasks:

    - name: Generate router config
      template:
        src: router_interfaces.j2
        dest: /etc/network/interfaces
        backup: yes

    - name: Enable IP forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: true

    - name: Check NAT rules
      command: iptables -t nat -S POSTROUTING
      register: nat_rules
      changed_when: false

    - name: Enable masquerading
      command: iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
      when: "'-A POSTROUTING -o eth0 -j MASQUERADE' not in nat_rules.stdout"